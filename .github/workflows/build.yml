name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # The project uses Xcode 27's project format, which Xcode 26 can't open.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
      - name: Build
        run: >
          xcodebuild -project GoDark.xcodeproj -scheme GoDark build
          CODE_SIGNING_ALLOWED=NO
